<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico de Estímulos — Atletismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#17181C; --muted:#6B6E76; --faint:#9AA0A6;
  --line:#E7E3DA; --line2:#EFECE4; --chip:#F1EEE7; --shadow:0 1px 2px rgba(20,20,25,.05),0 8px 24px -14px rgba(20,20,25,.18);
  --accent:#B23A2E; --ok:#2E8B84; --focus:#3457A6;
  --sans:'Inter',system-ui,sans-serif; --disp:'Bricolage Grotesque','Inter',sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131417; --card:#1B1D22; --ink:#ECEDEF; --muted:#9CA1AA; --faint:#6C727C;
    --line:#2A2D34; --line2:#23262C; --chip:#23262C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#131417; --card:#1B1D22; --ink:#ECEDEF; --muted:#9CA1AA; --faint:#6C727C;
  --line:#2A2D34; --line2:#23262C; --chip:#23262C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer}
::selection{background:var(--accent);color:#fff}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,#E0245E,#E8871E,#C9A227,#2E8B84,#3457A6,#E0245E);flex:0 0 auto}
.brand b{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);
  padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px}
.navbtn:hover{background:var(--line2);color:var(--ink)}
.navbtn.on{background:var(--ink);color:var(--paper)}
.navbtn svg{width:17px;height:17px;flex:0 0 auto}
.navfoot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.themebtn{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 9px;width:100%;font-weight:600;font-size:12.5px}
.themebtn:hover{color:var(--ink);border-color:var(--faint)}

.main{min-width:0;padding:22px 30px 90px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.field{position:relative}
.field input,.field select{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500;min-width:150px}
.field input:focus,.field select:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.field .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}

.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px}
.h2{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;margin:0 0 3px}
.lead{color:var(--muted);font-size:12.5px;margin:0}

/* distance rail */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.tile{flex:0 0 auto;min-width:118px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card);
  text-align:left;position:relative;transition:transform .12s ease, box-shadow .12s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .d{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.tile .d small{font-size:12px;font-weight:600;color:var(--muted)}
.tile .meta{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.35}
.tile .bar{height:4px;border-radius:3px;margin-top:10px}
.tile.on{outline:2px solid var(--ink);outline-offset:1px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:5px}

.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:70px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.brow .track{height:9px;background:var(--line2);border-radius:6px;overflow:hidden}
.brow .fill{height:100%;border-radius:6px}
.brow .n{text-align:right;color:var(--muted);font-size:12px}

/* session list */
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:16px 96px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line2)}
.srow:first-child{border-top:0}
.srow .dot{width:10px;height:10px;border-radius:50%}
.srow .when{font-size:12.5px;color:var(--muted)}
.srow .when b{display:block;color:var(--ink);font-weight:600;font-family:var(--disp)}
.srow .desc{font-weight:600}
.srow .desc small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.srow .stat{display:flex;gap:16px;align-items:center}
.srow .stat .s{text-align:right}
.srow .stat .s .n{font-family:var(--disp);font-weight:700;font-size:14px}
.srow .stat .s .k{font-size:10.5px;color:var(--faint)}
.srow:hover{background:var(--line2)}
.chk{width:16px;height:16px;border:1.5px solid var(--faint);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.chk.on{background:var(--focus);border-color:var(--focus)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip .cd{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}

.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,15,20,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:760px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:20px 22px 8px}
.mhead h3{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0}
.x{border:0;background:var(--chip);color:var(--muted);border-radius:9px;width:34px;height:34px;font-size:18px;line-height:1}
.x:hover{color:var(--ink)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.statgrid .c{background:var(--card);padding:11px 12px}
.statgrid .c .n{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.02em}
.statgrid .c .k{font-size:11px;color:var(--muted);margin-top:2px}

.ladder{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.ladder .r{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;padding:5px 8px;border-radius:8px;background:var(--chip);border:1px solid var(--line2)}
.ladder .r i{color:var(--faint);font-style:normal;font-weight:500;margin-right:5px}
.ladder .r.best{outline:1.5px solid var(--ok)}
.ladder .r.worst{color:var(--accent)}

.editrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.editrow label{font-size:13px;color:var(--muted);font-weight:600}
.editrow select,.editrow input,.editrow textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13.5px}
.rpe{display:flex;gap:5px;flex-wrap:wrap}
.rpe button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--muted)}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted)}
.hint{background:var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:900px){.split{grid-template-columns:1fr}}

/* compare bar */
.cbar{position:fixed;left:232px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 -8px 24px -16px rgba(0,0,0,.4)}
.cbar .items{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.cbar .it{font-size:12px;font-weight:600;background:var(--chip);border-radius:8px;padding:5px 9px;display:flex;gap:7px;align-items:center}
.cbar .it b{width:8px;height:8px;border-radius:50%}
.cbar .it button{border:0;background:transparent;color:var(--faint);font-size:14px;line-height:1}

/* dropzone */
.drop{border:2px dashed var(--line);border-radius:16px;padding:38px 24px;text-align:center;background:var(--card);transition:.15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.drop h3{font-family:var(--disp);font-weight:800;font-size:19px;margin:0 0 6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
table.tbl th,table.tbl td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl th{color:var(--muted);font-weight:600;background:var(--paper);position:sticky;top:0}
.mono{font-variant-numeric:tabular-nums}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:8px}

svg .grid{stroke:var(--line2)}
svg text{font-family:var(--sans)}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;z-index:30}
  .brand{padding:2px 8px;width:100%}
  .navbtn{width:auto;padding:8px 11px}
  .navfoot,.themebtn{display:none}
  .main{padding:18px 16px 120px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cbar{left:0}
  .srow{grid-template-columns:16px 1fr auto}
  .srow .when{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="brand"><div class="mark"></div><div><b>Histórico de estímulos</b><span>análise de treino · atletismo</span></div></div>
    <button class="navbtn on" data-view="overview" data-ico="grid">Visão geral</button>
    <button class="navbtn" data-view="distances" data-ico="target">Distâncias</button>
    <button class="navbtn" data-view="volume" data-ico="road">Volume geral</button>
    <button class="navbtn" data-view="objetivos" data-ico="layers">Objetivos fisiológicos</button>
    <button class="navbtn" data-view="evolucao" data-ico="trend">Evolução</button>
    <button class="navbtn" data-view="comparar" data-ico="compare">Comparar</button>
    <button class="navbtn" data-view="pista" data-ico="lane">Pista (Garmin)</button>
    <button class="navbtn" data-view="importar" data-ico="upload">Importar dados</button>
    <div class="navfoot">
      Os teus dados ficam só neste dispositivo, neste navegador. Nada é enviado para lado nenhum.
      <button class="themebtn" data-act="theme">Alternar claro / escuro</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>
<div id="comparebar"></div>

<script id="demo" type="application/json">{"meta":{},"workouts":[]}</script>
<script id="runs" type="application/json">{"meta":{},"cols":["date","dist_m","dur_s","type","hr"],"runs":[]}</script>
<script id="anndefaults" type="application/json">{}</script>

  const maxN=Math.max(...ws.map(w=>(w.reps||[]).length));
  const all=[].concat(...ws.map(w=>reps(w))); if(!all.length) return '<div class="note">As sessões escolhidas não têm tempos por repetição.</div>';
  const W=Math.max(360,maxN*46),H=210,pl=38,pr=12,pt=14,pb=28;
  const min=Math.min(...all),max=Math.max(...all); const lo=min-(max-min)*0.12-0.3,hi=max+(max-min)*0.12+0.3;
  const x=i=> pl+(maxN===1?(W-pl-pr)/2:i*(W-pl-pr)/(maxN-1));
  const y=v=> pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const pal=['#B23A2E','#2E8B84','#3457A6','#C9A227','#8E44AD','#E4572E'];
  let g='';
  for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="4" y="${yy+3}" font-size="9" fill="var(--faint)">${fmt(v)}</text>`;}
  let series='';
  ws.forEach((w,wi)=>{ const c=pal[wi%pal.length]; let line='',dots='';
    (w.reps||[]).forEach((v,i)=>{ if(v==null||v<=0)return; const px=x(i),py=y(v); line+=(line?'L':'M')+px+' '+py+' '; dots+=`<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`; });
    series+=`<path d="${line}" fill="none" stroke="${c}" stroke-width="2" opacity=".9"/>${dots}`;
  });
  for(let i=0;i<maxN;i++){ g+=`<text x="${x(i)}" y="${H-12}" font-size="9" fill="var(--muted)" text-anchor="middle">${i+1}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W}px">${g}${series}</svg>`;
}
function evoChart(list){ // list of {date,mean,best,dist}
  if(list.length<1) return '';
  const W=Math.max(300,list.length*54),H=150,pl=36,pr=10,pt=12,pb=24;
  const vals=[].concat(...list.map(p=>[p.mean,p.best].filter(v=>v)));
  if(!vals.length) return '<div class="note">Sem tempos por repetição para traçar a evolução.</div>';
  const min=Math.min(...vals),max=Math.max(...vals); const lo=min-(max-min)*0.15-0.3,hi=max+(max-min)*0.15+0.3;
  const x=i=> pl+(list.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(list.length-1));
  const y=v=> pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const c=heat(list[0].dist);
  let g='';for(let k=0;k<3;k++){const v=lo+(hi-lo)*k/2,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="3" y="${yy+3}" font-size="9" fill="var(--faint)">${fmt(v)}</text>`;}
  let lm='',lb='',dm='',db='';
  list.forEach((p,i)=>{ const px=x(i);
    if(p.mean){const py=y(p.mean);lm+=(lm?'L':'M')+px+' '+py+' ';dm+=`<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`;}
    if(p.best){const py=y(p.best);lb+=(lb?'L':'M')+px+' '+py+' ';db+=`<circle cx="${px}" cy="${py}" r="2.6" fill="var(--ok)"/>`;}
    g+=`<text x="${px}" y="${H-9}" font-size="8.5" fill="var(--muted)" text-anchor="middle">${p.date.slice(2,7).replace('-','/')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W}px">${g}<path d="${lm}" fill="none" stroke="${c}" stroke-width="2"/><path d="${lb}" fill="none" stroke="var(--ok)" stroke-width="1.6" stroke-dasharray="4 3"/>${dm}${db}</svg>`;
}

function miniLine(list,getY,color,yfmt,invert){
  const pts=list.map((p,i)=>({i,v:getY(p),d:p.date})).filter(p=>p.v!=null);
  if(pts.length<1) return '<div class="note">Sem dados para traçar.</div>';
  const n=list.length, W=Math.max(340,n*8), H=140, pl=42,pr=10,pt=12,pb=22;
  const vs=pts.map(p=>p.v); const min=Math.min(...vs),max=Math.max(...vs); const pad=(max-min)*0.12+ (max-min===0?1:0);
  const lo=min-pad,hi=max+pad;
  const x=i=> pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));
  const y=v=> pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';for(let k=0;k<3;k++){const v=lo+(hi-lo)*k/2,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="3" y="${yy+3}" font-size="9" fill="var(--faint)">${yfmt(v)}</text>`;}
  let line='',dots='';
  pts.forEach(p=>{ const px=x(p.i),py=y(p.v); line+=(line?'L':'M')+px+' '+py+' '; dots+=`<circle cx="${px}" cy="${py}" r="2.2" fill="${color}"/>`; });
  const step=Math.max(1,Math.round(n/6));
  for(let i=0;i<n;i+=step){ g+=`<text x="${x(i)}" y="${H-8}" font-size="8" fill="var(--muted)" text-anchor="middle">${(list[i].date||'').slice(2,7).replace('-','/')}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W}px">${g}<path d="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>${dots}</svg>`;
}

        <div class="kpi"><div class="v num">${(totalVol/1000).toFixed(1)}<small style="font-size:14px"> km</small></div><div class="l">Volume específico total</div></div>
        <div class="kpi"><div class="v num">${totalReps}</div><div class="l">Repetições registadas</div></div>
        <div class="kpi"><div class="v num">${dists.length}</div><div class="l">Distâncias diferentes</div></div>
      </div>

function vDistances(){

function vEvolucao(){
  const S=series();
  const byD={}; S.forEach(w=>{const d=w.rep_distance_m;if(!d)return;(byD[d]=byD[d]||[]).push(w);});
  const dists=Object.keys(byD).map(Number).sort((a,b)=>a-b).filter(d=>byD[d].length>=1);
  const cards=dists.map(d=>{
    const list=byD[d].sort((a,b)=>a.date.localeCompare(b.date));
    const evo=list.map(w=>({date:w.date,mean:stats(w).mean,best:stats(w).best,dist:d}));
    const first=stats(list[0]).mean, last=stats(list[list.length-1]).mean;
    const delta=(first&&last)?(last-first):null;
    const dtxt = delta==null?'':(delta<0?`▼ ${fmt(Math.abs(delta))} mais rápido`:`▲ ${fmt(Math.abs(delta))} mais lento`);
    return `<section class="card pad">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="h2"><span class="chip"><span class="cd" style="background:${heat(d)}"></span>${d} m</span></div>
        <div class="lead">${list.length} sess. ${delta!=null?'· média '+dtxt:''}</div>
      </div>
      <div style="overflow-x:auto;margin-top:10px">${evoChart(evo)}</div></section>`;
  }).join('');
  return topbar('Evolução','Como o mesmo estímulo mudou ao longo do tempo. A app mostra o dado; a interpretação fisiológica é tua.')+`
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${cards||('<div class="empty">'+icon('inbox')+'<div>Sem dados suficientes.</div></div>')}</div>`;
}

/* ---------- CSV import ---------- */
function wireImport(){
  const drop=document.getElementById('drop'), file=document.getElementById('file');
  if(file) file.onchange=()=>{ if(file.files.length) handleFiles(file.files); };
  if(drop){
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  }
}
function readCSV(f){
  const r=new FileReader();
  r.onload=()=>{ try{ const res=parseCSV(r.result); const ws=res.workouts;
      if(!ws.length){ flash(res.source==='garmin'?'Li o ficheiro, mas não encontrei sessões de pista (Atletismo de pista) neste export.':'Não encontrei sessões de séries ou pirâmide neste ficheiro.','err'); return; }
      const keep = state.isDemo? [] : state.workouts.filter(w=>w.source!==res.source);
      let merged = keep.concat(ws);
      merged.sort((a,b)=>a.date.localeCompare(b.date)); merged.forEach((w,i)=>w.id=i+1);
      state.workouts=merged; state.isDemo=false; save(LS.data,merged); state.selected.clear(); state.distance=null;
      if(res.source==='garmin'){ state.view='pista'; render(); flash(ws.length+' sessões de pista importadas do Garmin'+(merged.some(w=>w.type==='series')?' (as séries do Excel foram mantidas)':'')+'.','ok'); }
      else { state.view='overview'; render(); flash(ws.length+' sessões de séries importadas.','ok'); }
    }catch(err){ flash('Não consegui ler o ficheiro: '+err.message,'err'); } };
  r.readAsText(f,'utf-8');
}
function detectDelim(text){ const l=text.split(/\r?\n/).find(x=>x.trim())||''; const c={';':0,',':0,'\t':0}; for(const ch of l){ if(ch in c)c[ch]++; } if(c[';']>=c[','] && c[';']>0) return ';'; if(c['\t']>c[',']) return '\t'; return ','; }
function parseRows(text,delim){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===delim){ row.push(cur);cur=''; } else if(ch==='\n'){ row.push(cur);rows.push(row);row=[];cur=''; } else if(ch==='\r'){} else cur+=ch; } }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function repToS(v){ if(v==null)return null; const s=String(v).trim(); if(!s)return null; const t=(s.match(/\d+/g)||[]).map(Number); if(!t.length)return null;
  if(t.length>=4){ return t[0]*3600+t[1]*60+t[2]+(t[3]<100?t[3]/100:t[3]/1000); }
  if(t.length===3){ return t[0]*3600+t[1]*60+t[2]; }
  if(t.length===2){ return t[0]*60+t[1]; }
  return t[0]; }
function distToM(v){ if(v==null)return null; const s=String(v).replace(',','.').trim(); const n=parseFloat(s); return isNaN(n)?null:Math.round(n*1000); }
function seasonOf(y,m,d){ if(m>=9||(m===8&&d>=25))return y+'/'+(y+1); return (y-1)+'/'+y; }
function median(a){ const s=[...a].sort((x,y)=>x-y); const n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; }
function hmsToS(v){ if(v==null)return null; const s=String(v).trim(); if(!s||s==='--')return null;
  let m=s.match(/(\d+):(\d+):(\d+(?:[.,]\d+)?)/); if(m) return (+m[1])*3600+(+m[2])*60+parseFloat(m[3].replace(',','.'));
  m=s.match(/(\d+):(\d+(?:[.,]\d+)?)/); if(m) return (+m[1])*60+parseFloat(m[2].replace(',','.'));
  const f=parseFloat(s.replace(',','.')); return isNaN(f)?null:f; }
function garminDist(v){ if(v==null)return null; let s=String(v).trim().replace(/\s/g,''); if(!s||s==='--')return null;
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:Math.round(n*1000); }
function numOr(v){ if(v==null)return null; const s=String(v).trim(); if(!s||s==='--')return null; const n=parseFloat(s.replace(',','.')); return isNaN(n)?null:n; }
function colIdx(H,names){ for(const n of names){ const i=H.indexOf(n); if(i>=0)return i; } return -1; }
function parseGarmin(rows){
  const H=(rows[0]||[]).map(x=>String(x).trim());
  const ci={type:colIdx(H,['Tipo de atividade','Activity Type']),date:colIdx(H,['Data','Date']),title:colIdx(H,['Título','Title']),
    dist:colIdx(H,['Distância','Distance']),time:colIdx(H,['Tempo','Time']),hr:colIdx(H,['RC médio','Avg HR']),hrmax:colIdx(H,['RC máximo','Max HR']),
    cad:colIdx(H,['Cadência média de corrida','Avg Run Cadence']),laps:colIdx(H,['Número de voltas','Number of Laps']),
    best:colIdx(H,['Tempo da melhor volta','Best Lap Time']),tmax:colIdx(H,['Temperatura Máx.','Max Temp'])};
  const out=[];
  for(let i=1;i<rows.length;i++){ const r=rows[i]; if(!r||!r.length) continue;
    const t=(r[ci.type]||'').trim(); if(t!=='Atletismo de pista'&&t!=='Track Running') continue;
    const dstr=(r[ci.date]||'').trim(); if(dstr.length<10) continue;
    const y=+dstr.slice(0,4),mo=+dstr.slice(5,7),da=+dstr.slice(8,10); if(!y) continue;
    const all={}; for(let c=0;c<H.length;c++){ const lbl=H[c]; if(!lbl)continue; const v=(r[c]==null?'':String(r[c]).trim()); if(v===''||v==='--'||v==="'--")continue; all[lbl]=v; }
    out.push({date:dstr.slice(0,10),year:y,month:mo,day:da,season:seasonOf(y,mo,da),source:'garmin',type:'pista',
      title:(r[ci.title]||'').trim(),dist_m:garminDist(r[ci.dist]),time_s:hmsToS(r[ci.time]),
      hr_avg:numOr(r[ci.hr]),hr_max:numOr(r[ci.hrmax]),cad:numOr(r[ci.cad]),laps:numOr(r[ci.laps]),
      best_lap_s:hmsToS(r[ci.best]),temp:ci.tmax>=0?numOr(r[ci.tmax]):null,all:all});
  }
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return {source:'garmin',workouts:out};
}
function parseCSV(text){
  const delim=detectDelim(text);
  const rows=parseRows(text,delim);
  const H0=(rows[0]||[]).map(x=>String(x).trim());
  if(H0.includes('Tipo de atividade')||H0.includes('Activity Type')) return parseGarmin(rows);
  let hr=-1; for(let i=0;i<rows.length;i++){ if(rows[i].some(c=>String(c).trim()==='Atleta')){ hr=i; break; } }
  if(hr<0) throw new Error('não reconheci o formato — esperava o Excel de séries (linha "Atleta") ou o export de atividades do Garmin (coluna "Tipo de atividade").');
  return {source:'excel',workouts:parseSeriesRows(rows,hr)};
}
function parseSeriesRows(rows,hr){
  const out=[]; let id=0;
  for(let i=hr+1;i<rows.length;i++){ const r=rows[i]; const g=(idx)=> (r[idx]!==undefined? String(r[idx]).trim():'');
    const atl=g(0), tipo=g(4); if(!atl||!tipo) continue;
    const T=tipo.trim(); if(!/S[eé]ries/i.test(T)&&!/Pir[aâ]mide/i.test(T)) continue;
    const y=parseInt(g(1)),mo=parseInt(g(2)),da=parseInt(g(3)); if(!y||!mo||!da) continue;
    const iso=y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
    id++; const base={id,date:iso,year:y,month:mo,day:da,season:seasonOf(y,mo,da),warmup_s:repToS(g(5)),obs:g(68)};
    if(/S[eé]ries/i.test(T)){
      const dm=distToM(g(12)), n=parseInt(g(13))||null, iv=repToS(g(14));
      const rep=[]; for(let c=24;c<=48;c++){ const raw=g(c); if(raw==='')continue; rep.push(repToS(raw)); }
      const valid=rep.filter(x=>x&&x>0);
      out.push(Object.assign(base,{type:'series',rep_distance_m:dm,n_reps:n,interval_s:iv,reps:rep,
        best_s:valid.length?Math.min(...valid):null,worst_s:valid.length?Math.max(...valid):null,
        mean_s:valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null,median_s:valid.length?median(valid):null,
        total_dist_m:(dm&&n)?dm*n:null,total_time_s:valid.length?valid.reduce((a,b)=>a+b,0):null}));
    } else {
      const steps=[]; for(let k=0;k<10;k++){ const dcol=49+k*2,icol=50+k*2,tcol=24+k; const dk=g(dcol),it=repToS(g(icol)),tt=repToS(g(tcol));
        if(dk===''&&tt==null)continue; steps.push({dist_m:distToM(dk),t_s:tt,int_s:it}); }
      out.push(Object.assign(base,{type:'piramide',steps,total_time_s:null}));
    }
  }
  out.sort((a,b)=>a.date.localeCompare(b.date)); out.forEach(w=>w.source='excel');
  return out;
}

/* ============ Volume geral (todas as corridas) ============ */
const RUNS=(()=>{ try{ const j=JSON.parse(document.getElementById('runs').textContent); return j.runs.map(r=>({date:r[0],dist:r[1],dur:r[2],type:r[3],hr:r[4]})); }catch(e){ return []; } })();
const TYPELBL={estrada:'Estrada',passadeira:'Passadeira',pista:'Pista',trail:'Trail'};
function rseason(iso){ const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10); return (m>=9||(m===8&&d>=25))?y+'/'+(y+1):(y-1)+'/'+y; }
function vVolume(){
  if(!RUNS.length) return topbar('Volume geral','Todas as corridas — rolar, longos, competições.')+`<div class="empty">${icon('road')}<div>Sem corridas carregadas.</div></div>`;
  const filtered = state.season==='all'? RUNS : RUNS.filter(x=>rseason(x.date)===state.season);
  const totalKm=filtered.reduce((a,x)=>a+x.dist,0)/1000;
  const nRuns=filtered.length;
  const hours=filtered.reduce((a,x)=>a+x.dur,0)/3600;
  const avgKm=nRuns?totalKm/nRuns:0;
  // specific (series) volume for the same filter
  const specKm=series().filter(w=>state.season==='all'||w.season===state.season).reduce((a,w)=>a+(w.total_dist_m||0),0)/1000;
  // by season (always all)
  const seasonKm={},seasonN={},seasonSpec={};
  RUNS.forEach(x=>{const s=rseason(x.date); seasonKm[s]=(seasonKm[s]||0)+x.dist/1000; seasonN[s]=(seasonN[s]||0)+1;});
  series().forEach(w=>{ seasonSpec[w.season]=(seasonSpec[w.season]||0)+(w.total_dist_m||0)/1000; });
  const seasons=Object.keys(seasonKm).sort();
  const maxS=Math.max(...seasons.map(s=>seasonKm[s]));
  const seasonBars=seasons.map(s=>`<div class="brow" style="grid-template-columns:88px 1fr 96px"><div><span class="chip">${s}</span></div>
    <div class="track"><div class="fill" style="width:${seasonKm[s]/maxS*100}%;background:${heat(1000)}"></div></div>
    <div class="n num">${Math.round(seasonKm[s])} km<span style="color:var(--faint);font-weight:500"> · ${seasonN[s]}</span></div></div>`).join('');
  // by month (within filter)
  const monthKm={}; filtered.forEach(x=>{const k=x.date.slice(0,7); monthKm[k]=(monthKm[k]||0)+x.dist/1000;});
  const months=Object.keys(monthKm).sort();
  const monthList=months.map(m=>({date:m+'-01',km:monthKm[m]}));
  // by type
  const typeKm={}; filtered.forEach(x=>{typeKm[x.type]=(typeKm[x.type]||0)+x.dist/1000;});
  const typeRows=Object.keys(typeKm).sort((a,b)=>typeKm[b]-typeKm[a]).map(t=>{
    const pct=totalKm?typeKm[t]/totalKm*100:0;
    return `<div class="brow" style="grid-template-columns:96px 1fr 78px"><div><span class="chip">${TYPELBL[t]||t}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${heat(400)}"></div></div>
      <div class="n num">${Math.round(typeKm[t])} km</div></div>`;}).join('');
  // specific vs general table (per season)
  const svRows=seasons.map(s=>{ const g=seasonKm[s]||0, sp=seasonSpec[s]||0; const pct=g?sp/g*100:0;
    return `<tr><td>${s}</td><td class="mono">${Math.round(g)}</td><td class="mono">${sp?sp.toFixed(1):'—'}</td><td class="mono">${g?pct.toFixed(1)+'%':'—'}</td></tr>`;}).join('');
  const sub = state.season==='all'? `carreira · ${seasons[0]}–${seasons[seasons.length-1]}` : ('época '+state.season);
  return topbar('Volume geral', `${Math.round(totalKm)} km · ${nRuns} corridas · ${Math.round(hours)} h — ${sub}`)+`
    <div class="grid">
      <div class="kpis">
        <div class="kpi"><div class="v num">${Math.round(totalKm)}<small style="font-size:14px"> km</small></div><div class="l">Volume total</div></div>
        <div class="kpi"><div class="v num">${nRuns}</div><div class="l">Corridas</div></div>
        <div class="kpi"><div class="v num">${avgKm.toFixed(1)}<small style="font-size:14px"> km</small></div><div class="l">Média por corrida</div></div>
        <div class="kpi"><div class="v num">${specKm?Math.round(specKm):'—'}<small style="font-size:14px"> km</small></div><div class="l">Volume específico (séries)</div></div>
      </div>
      <section class="card pad">
        <div class="h2">Volume por época</div><p class="lead">Quilómetros e número de corridas em cada época desportiva.</p>
        <div class="bars" style="margin-top:14px">${seasonBars}</div>
      </section>
      <div class="two">
        <section class="card pad"><div class="h2">Volume mensal</div><p class="lead">Quilómetros por mês${state.season==='all'?' (toda a carreira)':(' em '+state.season)}.</p>
          <div style="overflow-x:auto;margin-top:10px">${miniLine(monthList,p=>p.km,heat(1000),v=>Math.round(v)+'k'.replace('k',''))}</div></section>
        <section class="card pad"><div class="h2">Por tipo de piso</div><p class="lead">Onde se acumulou o volume.</p>
          <div class="bars" style="margin-top:14px">${typeRows}</div></section>
      </div>
      <section class="card pad">
        <div class="h2">Volume geral vs específico</div><p class="lead">Quanto do volume total foi trabalho de séries (volume específico) em cada época.</p>
        <div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Época</th><th>Volume geral (km)</th><th>Específico (km)</th><th>% específico</th></tr></thead><tbody>${svRows}</tbody></table></div>
        <div class="note" style="margin-top:8px">Volume específico = soma dos metros das repetições (o teu Excel + as séries reconstruídas do Garmin). O volume geral vem de todas as corridas registadas no Garmin.</div>
      </section>
    </div>`;
}

/* ============ Leitor FIT (Garmin) — camada de ingestão ============ */
const FIT_NICE=[100,150,200,300,400,500,600,800,1000,1200,1500,2000,3000,5000];
function fitSnap(d){ if(!d)return null; return FIT_NICE.reduce((a,b)=>Math.abs(b-d)<Math.abs(a-d)?b:a); }
function fitMedian(a){ const s=[...a].sort((x,y)=>x-y),n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null; }
function fitCad(l){ if(l.avg_cadence==null)return null; return Math.round((l.avg_cadence+(l.avg_fractional_cadence||0))*2); }
function hrNear(series,ts){ if(!ts||!series.length)return null; let best=null,bd=1e9; for(const p of series){ const dd=Math.abs(p.t-ts); if(dd<bd){bd=dd;best=p.h;} } return bd<15000?best:null; }

function reconstructFit(data, fname){
  const laps=data.laps||[], records=data.records||[], sess=(data.sessions||[])[0]||{};
  if(!laps.length) return null;
  const L=laps.map(l=>({
    dist:Math.round(l.total_distance||0),
    t:+(((l.total_timer_time!=null?l.total_timer_time:l.total_elapsed_time)||0).toFixed(1)),
    hr:l.avg_heart_rate||null, hrmax:l.max_heart_rate||null, cad:fitCad(l),
    step:l.avg_step_length?+(l.avg_step_length).toFixed(0):null,
    gct:l.avg_stance_time?Math.round(l.avg_stance_time):null,
    vo:l.avg_vertical_oscillation?+(l.avg_vertical_oscillation).toFixed(1):null,
    temp:l.avg_temperature!=null?l.avg_temperature:null,
    intensity:l.intensity||null, trig:l.lap_trigger||null,
    start:l.start_time?new Date(l.start_time).getTime():null
  }));
  // HR record series for recovery HR
  const series=records.filter(r=>r.timestamp&&r.heart_rate!=null).map(r=>({t:new Date(r.timestamp).getTime(),h:r.heart_rate}));
  series.sort((a,b)=>a.t-b.t);
  // cluster by snapped distance; work = larger of two most common clusters
  const counts={}; L.forEach(x=>{const s=fitSnap(x.dist); if(s)counts[s]=(counts[s]||0)+1;});
  const clusters=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]);
  const startDate=sess.start_time?new Date(sess.start_time):(L[0].start?new Date(L[0].start):new Date());
  const y=startDate.getFullYear(),mo=startDate.getMonth()+1,da=startDate.getDate();
  const iso=y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
  const rawLaps=L.map(x=>({dist_m:x.dist,t_s:x.t,hr_avg:x.hr,hr_max:x.hrmax,cad:x.cad,intensity:x.intensity,trigger:x.trig}));
  const base={date:iso,year:y,month:mo,day:da,season:seasonOf(y,mo,da),source:'garmin-fit',
    title:(sess.sport==='running'?'Corrida':'Sessão')+(sess.sub_sport?(' · '+sess.sub_sport):''),
    obs:'', warmup_s:null, total_time_s:sess.total_timer_time?Math.round(sess.total_timer_time):null,
    ses_hr_avg:sess.avg_heart_rate||null, ses_hr_max:sess.max_heart_rate||null,
    ses_dist_m:sess.total_distance?Math.round(sess.total_distance):null, garmin_laps:rawLaps, fname:fname||null};
  if(clusters.length<1) return Object.assign(base,{type:'pista',dist_m:base.ses_dist_m,time_s:base.total_time_s,hr_avg:base.ses_hr_avg,hr_max:base.ses_hr_max,laps:L.length,best_lap_s:Math.min(...L.map(x=>x.t)),all:{}});
  const workDist=Math.max(...clusters.slice(0,2));
  const isWork=x=>fitSnap(x.dist)===workDist;
  const works=L.filter(isWork);
  if(works.length<2){ // não parece intervalado → guarda como sessão de pista (resumo)
    return Object.assign(base,{type:'pista',dist_m:base.ses_dist_m,time_s:base.total_time_s,hr_avg:base.ses_hr_avg,hr_max:base.ses_hr_max,laps:L.length,best_lap_s:Math.min(...L.map(x=>x.t)),all:{}});
  }
  const wIdx=L.map((x,i)=>isWork(x)?i:-1).filter(i=>i>=0);
  const recs=[];
  for(let k=0;k<wIdx.length-1;k++){ const seg=L.slice(wIdx[k]+1,wIdx[k+1]); if(seg.length) recs.push({t:seg.reduce((a,s)=>a+s.t,0),hr:seg[0].hr}); }
  const interval=recs.length?Math.round(recs.reduce((a,b)=>a+b.t,0)/recs.length):null;
  const detail=works.map((w,i)=>{
    const recAfter=recs[i]||null;
    const hrEndRec=(i+1<works.length)?hrNear(series,works[i+1].start):null;
    const hrEndRep=hrNear(series,(w.start!=null?w.start+w.t*1000:null));
    return {n:i+1,t_s:w.t,dist_m:w.dist,hr_avg:w.hr,hr_max:w.hrmax,cad:w.cad,step:w.step,gct:w.gct,vo:w.vo,
            rec_s:recAfter?recAfter.t:null,rec_hr:recAfter?recAfter.hr:null,hr_end_rep:hrEndRep,hr_end_rec:hrEndRec};
  });
  const reps=works.map(w=>w.t);
  const valid=reps.filter(x=>x>0);
  return Object.assign(base,{type:'series',rep_distance_m:workDist,n_reps:works.length,interval_s:interval,
    reps, rep_detail:detail,
    best_s:Math.min(...valid),worst_s:Math.max(...valid),mean_s:valid.reduce((a,b)=>a+b,0)/valid.length,median_s:fitMedian(valid),
    total_dist_m:workDist*works.length,total_time_s:reps.reduce((a,b)=>a+b,0),
    hr_avg:base.ses_hr_avg,hr_max:base.ses_hr_max});
}

function parseFitBuffer(arrayBuffer, fname){
  return new Promise((resolve)=>{
    try{
      const fp=new FitParser({mode:'list',lengthUnit:'m',speedUnit:'m/s',force:true});
      fp.parse(new Uint8Array(arrayBuffer),(err,data)=>{
        if(err){ resolve({error:String(err)}); return; }
        try{ const w=reconstructFit(data, fname); resolve(w?{workout:w}:{error:'sem voltas'}); }
        catch(e){ resolve({error:String(e)}); }
      });
    }catch(e){ resolve({error:String(e)}); }
  });
}

function readAsArrayBuffer(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(f); }); }
function readAsText(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f,'utf-8'); }); }

async function handleFiles(fileList){
  const files=[...fileList]; if(!files.length) return;
  flash('A processar '+files.length+' ficheiro'+(files.length>1?'s':'')+'…','ok');
  const fitSessions=[]; const csvResults=[]; const problems=[];
  for(const f of files){
    const name=(f.name||'').toLowerCase();
    try{
      if(name.endsWith('.zip')){
        const ab=await readAsArrayBuffer(f);
        const zip=fflate.unzipSync(new Uint8Array(ab));
        for(const path of Object.keys(zip)){
          if(path.toLowerCase().endsWith('.fit')){
            const r=await parseFitBuffer(zip[path].buffer, path.split('/').pop());
            if(r.workout) fitSessions.push(r.workout); else problems.push(path+': '+r.error);
          }
        }
      } else if(name.endsWith('.fit')){
        const ab=await readAsArrayBuffer(f);
        const r=await parseFitBuffer(ab, f.name);
        if(r.workout) fitSessions.push(r.workout); else problems.push(f.name+': '+r.error);
      } else if(name.endsWith('.csv')){
        const txt=await readAsText(f);
        const res=parseCSV(txt); csvResults.push(res);
      } else {
        problems.push(f.name+': formato não reconhecido');
      }
    }catch(e){ problems.push((f.name||'ficheiro')+': '+e.message); }
  }
  // merge
  let base = state.isDemo? [] : state.workouts.slice();
  // CSV: replace by source
  csvResults.forEach(res=>{ base=base.filter(w=>w.source!==res.source).concat(res.workouts); });
  // FIT: append with dedup by date+round(total_time)
  const keyF=w=>w.date+'#'+Math.round(w.total_time_s||0)+'#'+(w.rep_distance_m||w.dist_m||'');
  const have=new Set(base.filter(w=>w.source==='garmin-fit').map(keyF));
  let added=0;
  fitSessions.forEach(w=>{ const k=keyF(w); if(!have.has(k)){ have.add(k); base.push(w); added++; } });
  if(!base.length){ flash('Não consegui extrair sessões dos ficheiros.'+(problems.length?' ('+problems[0]+')':''),'err'); return; }
  base.sort((a,b)=>a.date.localeCompare(b.date)); base.forEach((w,i)=>w.id=i+1);
  state.workouts=base; state.isDemo=false; save(LS.data,base); state.selected.clear(); state.distance=null;
  const msgs=[];
  if(added) msgs.push(added+' sessão(ões) de FIT reconstruída(s) repetição a repetição');
  const nfitpista=fitSessions.filter(w=>w.type==='pista').length;
  if(nfitpista) msgs.push(nfitpista+' guardada(s) como resumo (voltas irregulares)');
  if(csvResults.length) msgs.push(csvResults.reduce((a,r)=>a+r.workouts.length,0)+' de CSV');
  const firstFit=fitSessions.find(w=>w.type==='series');
  if(firstFit){ state.view='distances'; state.distance=firstFit.rep_distance_m; }
  else if(csvResults.some(r=>r.source==='garmin')) state.view='pista';
  else state.view='overview';
  render();
  flash((msgs.join(' · ')||'Importado')+'.'+(problems.length?' '+problems.length+' ignorado(s).':''),'ok');
  if(firstFit){ const w=state.workouts.find(x=>x.source==='garmin-fit'&&x.type==='series'&&x.date===firstFit.date); if(w){ setTimeout(()=>openModal(w.id),350); } }
}

document.querySelectorAll('.navbtn[data-ico]').forEach(b=>{ b.insertAdjacentHTML('afterbegin', icon(b.dataset.ico)); });
render();
</script>
